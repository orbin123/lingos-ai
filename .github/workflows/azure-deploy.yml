name: Azure backend deploy

# Production deployment is gated by the protected `production` Environment.
# GitHub OIDC uses only non-secret identifiers; no Azure client secret exists.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/scripts/azure-*.sh"
      - ".github/workflows/azure-deploy.yml"
      - "infra/azure/tests/host_contract_guardrails.sh"
      - "infra/azure/tests/lifecycle_guardrails.sh"
  pull_request:
    paths:
      - ".github/scripts/azure-*.sh"
      - ".github/workflows/azure-deploy.yml"
      - "infra/azure/tests/host_contract_guardrails.sh"
      - "infra/azure/tests/lifecycle_guardrails.sh"
  workflow_dispatch:

concurrency:
  group: azure-production-operations
  cancel-in-progress: false

permissions: {}

env:
  AZURE_CORE_OUTPUT: none
  AZURE_RESOURCE_GROUP: rg-lingosai-prod
  AZURE_VM_NAME: vm-lingosai-prod
  AZURE_EPHEMERAL_BILLING_ENABLED: ${{ vars.AZURE_EPHEMERAL_BILLING_ENABLED || 'false' }}

jobs:
  test:
    name: test backend before deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Validate Azure host contract
        working-directory: .
        run: |
          bash infra/azure/tests/host_contract_guardrails.sh
          bash infra/azure/tests/lifecycle_guardrails.sh
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint and format check
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Type check
        run: uv run mypy app
      - name: Unit and integration tests
        run: uv run python -m pytest tests/unit tests/integration -q
      - name: OpenAPI drift check
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  deploy:
    name: build and deploy pinned commit
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_AUTOMATION_ENABLED == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.AZURE_API_BASE_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_POSTGRES_SERVER: ${{ vars.AZURE_POSTGRES_SERVER }}
      AZURE_API_BASE_URL: ${{ vars.AZURE_API_BASE_URL }}
      AZURE_PRODUCTION_ENVIRONMENT_GUARD: ${{ vars.AZURE_PRODUCTION_ENVIRONMENT_GUARD }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate non-secret production identifiers
        run: |
          set -euo pipefail
          [[ "$AZURE_PRODUCTION_ENVIRONMENT_GUARD" == "reviewed-and-protected" ]]
          [[ "$AZURE_POSTGRES_SERVER" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]
          [[ "$AZURE_API_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$ ]]

      - name: Authenticate to Azure with GitHub OIDC
        id: azure_login
        # Pinned official azure/login v2 action; OIDC is the only auth path.
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Require an active, healthy production window
        run: .github/scripts/azure-control-plane.sh preflight

      - name: Build and deploy the exact commit on the VM
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts @.github/scripts/azure-vm-deploy.sh \
            --parameters deploy "$GITHUB_SHA" \
            --output none \
            --only-show-errors

      - name: External health checks and automatic application rollback
        run: |
          set -euo pipefail
          base_url="${AZURE_API_BASE_URL%/}"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 10 "$base_url/health/live" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 "$base_url/health/ready" >/dev/null; then
              echo "External health checks passed for commit $GITHUB_SHA"
              exit 0
            fi
            echo "External health attempt $attempt/15 failed"
            sleep 8
          done

          echo "::error::External health checks failed; restoring the previous application digest"
          az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts @.github/scripts/azure-vm-deploy.sh \
            --parameters rollback \
            --output none \
            --only-show-errors || echo "::error::Automatic application rollback also failed"
          exit 1

      - name: Record deployed commit in non-secret resource-group tags
        run: |
          set -euo pipefail
          group_id="$(az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --query id \
            --output tsv \
            --only-show-errors)"
          az tag update \
            --resource-id "$group_id" \
            --operation Merge \
            --tags "lingosai-deployed-sha=$GITHUB_SHA" \
            --output none \
            --only-show-errors

      - name: Deployment summary
        run: |
          {
            echo "### Azure backend deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Deployment: built on the VM from the pinned public commit and stored by immutable local image ID"
            echo "- Database migrations: forward-only; never rolled back automatically"
          } >>"$GITHUB_STEP_SUMMARY"
